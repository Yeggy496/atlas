# Render deployment configuration for the existing OptiDay service.
# Commit frontend/dist together with source before deploying this small demo.
services:
  - type: web
    name: optiday
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-lock.txt && python run_demo.py --check
    startCommand: OPTIDAY_SOLVE_SECONDS=30 OPTIDAY_SOLVER_WORKERS=1 OPTIDAY_DIAGNOSIS_SECONDS=2 uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: LLM_PROVIDER
        value: demo
      - key: OPTIDAY_DB_PATH
        value: /tmp/optiday.db

      # Keep demo until a key is saved. To enable DeepSeek, set LLM_PROVIDER=deepseek
      # and these values in the existing service's dashboard (never commit a key):
      # - key: DEEPSEEK_API_KEY
      #   sync: false
      # - key: DEEPSEEK_MODEL
      #   value: deepseek-flash
      # - key: DEEPSEEK_TIMEOUT
      #   value: "90"
      # OpenAI remains an alternative provider:
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_MODEL
      #   value: gpt-4.1-mini
      # - key: OPENAI_BASE_URL
      #   sync: false
      # - key: OPENAI_TIMEOUT
      #   value: "300"
